spring.application.name=clothes_store

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Открытая сессия в "view" маскирует N+1 и держит соединение до сериализации ответа.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Ограничение размера страницы, иначе клиент может запросить size=1000000.
spring.data.web.pageable.max-page-size=100

app.storage.location=${APP_STORAGE_LOCATION:./uploads}
# Относительный URL работает и локально, и за reverse-proxy.
# Для CDN/отдельного домена переопределяется через APP_STORAGE_BASE_URL.
app.storage.base-url=${APP_STORAGE_BASE_URL:/files}
app.upload.max-batch-size=${APP_UPLOAD_MAX_BATCH_SIZE:20}

# Origin(ы) SPA для CORS, через запятую. Cookie-сессия требует allowCredentials,
# поэтому "*" использовать нельзя.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml

# Наружу отдаём только health (для docker healthcheck / k8s probes).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

