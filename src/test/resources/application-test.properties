# Тестовый профиль (@ActiveProfiles("test")): H2 в режиме PostgreSQL,
# схема создаётся Hibernate, Flyway отключён.
# Остальные настройки берутся из основного application.properties.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.storage.location=./target/test-uploads
app.storage.base-url=/files
app.upload.max-batch-size=20
app.cors.allowed-origins=http://localhost:3000
